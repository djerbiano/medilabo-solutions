spring.application.name=front
server.port=8084

# Lecture du fichier .env local
spring.config.import=optional:file:.env[.properties]

# Accès au gateway (seul point d'entrée vers les microservices)
gateway.url=${GATEWAY_URL:http://localhost:8080}
gateway.username=${GATEWAY_USERNAME}
gateway.password=${GATEWAY_PASSWORD}

# Temps d'attente max quand le front appelle le gateway
gateway.connect-timeout=2s
gateway.read-timeout=5s
