<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${patient.id == null} ? 'Ajouter un patient - MédiLabo' : 'Modifier un patient - MédiLabo'">Patient
        - MédiLabo</title>
    <style>
        .error {
            color: red;
        }
    </style>
</head>
<body>
<h1 th:text="${patient.id == null} ? 'Ajouter un patient' : 'Modifier un patient'">Patient</h1>

<form id="patientForm" th:action="${patient.id == null} ? @{/patients} : @{/patients/{id}(id=${patient.id})}"
      th:data-fresh-url="${patient.id == null} ? @{/patients/new} : @{/patients/{id}/edit(id=${patient.id})}"
      th:object="${patient}" method="post" autocomplete="off">
    <input type="hidden" th:field="*{id}">
    <p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Erreur globale</p>
    <p>
        <label for="firstName">Prénom *</label>
        <input type="text" id="firstName" th:field="*{firstName}">
        <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Erreur</span>
    </p>
    <p>
        <label for="lastName">Nom *</label>
        <input type="text" id="lastName" th:field="*{lastName}">
        <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Erreur</span>
    </p>
    <p>
        <label for="birthDate">Date de naissance *</label>
        <input type="date" id="birthDate" th:field="*{birthDate}">
        <span class="error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}">Erreur</span>
    </p>
    <p>
        <label for="gender">Genre *</label>
        <select id="gender" th:field="*{gender}">
            <option value="">-- Choisir --</option>
            <option value="F">Femme</option>
            <option value="M">Homme</option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}">Erreur</span>
    </p>
    <p>
        <label for="address">Adresse</label>
        <input type="text" id="address" th:field="*{address}">
        <span class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Erreur</span>
    </p>
    <p>
        <label for="phone">Téléphone</label>
        <input type="text" id="phone" th:field="*{phone}">
        <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Erreur</span>
    </p>
    <p>
        <button type="submit">Enregistrer</button>
        <a th:href="@{/patients}">Annuler</a>
    </p>
</form>
<script>
    // Quand on revient sur cette page avec "Précédent", le navigateur affiche une vieille copie. on redemande le formulaire au serveur pour avoir les bonnes infos.
    window.addEventListener("pageshow", function (event) {
        const navigation = performance.getEntriesByType("navigation")[0];
        if (event.persisted || navigation.type === "back_forward") {
            location.replace(document.getElementById("patientForm").dataset.freshUrl);
        }
    });
</script>
</body>
</html>
