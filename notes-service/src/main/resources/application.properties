spring.application.name=notes-service
server.port=8082

# Lecture du fichier .env local
spring.config.import=optional:file:.env[.properties]

# Création automatique des index déclarés avec @Indexed
spring.data.mongodb.auto-index-creation=true

# Adresse de la base MongoDB, prise dans le .env
spring.mongodb.uri=${MONGODB_URI}

# Adresse de patient-service, pour vérifier que le patient existe
patient-service.url=${PATIENT_SERVICE_URL:http://localhost:8081}

# Temps d'attente max quand le notes-service appelle patient-service
patient-service.connect-timeout=2s
patient-service.read-timeout=5s