spring.application.name=gateway
server.port=8080

# Route vers patient-service
spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=${PATIENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/patients/**

# Route vers notes-service
spring.cloud.gateway.server.webflux.routes[1].id=notes-service
spring.cloud.gateway.server.webflux.routes[1].uri=${NOTES_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notes/**
# Le notes-service appelle lui-même patient-service (2 s connexion + 5 s réponse = 7 s au pire) : on lui laisse 8 s
spring.cloud.gateway.server.webflux.routes[1].metadata.response-timeout=8000

# Lecture du fichier .env local
spring.config.import=optional:file:.env[.properties]

# Temps d'attente max quand le gateway appelle un service
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

# Utilisateur autorisé à passer le gateway
spring.security.user.name=${GATEWAY_USERNAME}
spring.security.user.password=${GATEWAY_PASSWORD}
