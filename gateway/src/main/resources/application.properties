spring.application.name=gateway
server.port=8080

# Route vers patient-service
spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=${PATIENT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/patients/**

# Lecture du fichier .env local
spring.config.import=optional:file:.env[.properties]

# Utilisateur autorisé à passer le gateway
spring.security.user.name=${GATEWAY_USERNAME}
spring.security.user.password=${GATEWAY_PASSWORD}